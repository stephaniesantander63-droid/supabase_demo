$def with(contacto)

$if contacto != []:
    <h2>¿Estás seguro de que deseas eliminar este contacto?</h2>
    <form name="borrar_contacto" method="POST">
        <input type="hidden" name="id_contacto" value="$contacto[0]['id_contacto']">

        <label for="nombre">Nombre</label>
        <input type="text" name="nombre" id="nombre" value="$contacto[0]['nombre']" readonly><br>

        <label for="email">Email</label>
        <input type="email" name="email" id="email" value="$contacto[0]['email']" readonly><br>

        <label for="telefono">Teléfono</label>
        <input type="tel" name="telefono" id="telefono" value="$contacto[0]['telefono']" readonly><br>

        <button type="submit">Confirmar Eliminar</button>
        <button type="button" onclick="location.href='/contactos';">Cancelar</button>
    </form>
$else:
    <h2>No se encontró el contacto.</h2>
    <a href="/contactos">Regresar</a>
