$def with(datos)
<h1>Contactos</h1>

<a href="/insertar_contacto">Insertar Contacto</a>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th>Ver</th>
            <th>Actualizar</th>
            <th>Borrar</th>
        </tr>
    </thead>
    <tbody>
    $for contacto in datos:
        <tr>
            <td>$contacto['id_contacto']</td>
            <td>$contacto['nombre']</td>
            <td>$contacto['email']</td>
            <td>$contacto['telefono']</td>
            <td><a href="/ver_contacto/$contacto['id_contacto']">Ver</a></td>
            <td><a href="/actualizar_contacto/$contacto['id_contacto']">Actualizar</a></td>
            <td><a href="/borrar_contacto/$contacto['id_contacto']">Borrar</a></td>
        </tr>
    </tbody>
</table>
